[project]
name = "llm-cache-gateway"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "matplotlib",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cache", "benchmark"]